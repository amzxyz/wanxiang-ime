name: Wanxiang Debug APK
on:
  push:
    branches: [dev]
  pull_request:
    branches: [wanxiang]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    if: github.event_name != 'push' || !github.event.created
    runs-on: ubuntu-22.04
    env:
      BUILD_ABI: arm64-v8a
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          repository: amzxyz/librime-evo
          ref: dev
          path: .ci/evo
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: amzxyz/librime-evo-lua
          ref: 2129aa76ad0bc922f970d2d7f87380168761a012
          path: .ci/evo/plugins/lua
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: amzxyz/librime-evo-octagram
          ref: f9652e7ed0e699d55588418ae492edddeaf28360
          path: .ci/evo/plugins/octagram
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools cmake;3.31.6 build-tools;36.1.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true
      - run: ./gradlew --no-daemon -p build-logic :convention:test --tests RimeSdkArchiveTest
      - run: python3 tools/prepare-ci-ndk.py
      - run: ./prepare_personal_build.sh
      - name: Build current EVO engine against verified dependency SDK
        run: |
          python3 tools/build-evo-sdk.py --core .ci/evo --dependencies native/rime-sdk --output "$RUNNER_TEMP/evo-sdk" --abi "$BUILD_ABI"
      - name: Build Debug APK with stable signing key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SIGN_KEY_PWD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${RELEASE_KEYSTORE_BASE64:?Missing RELEASE_KEYSTORE_BASE64}"
          : "${SIGN_KEY_PWD:?Missing RELEASE_STORE_PASSWORD}"
          : "${SIGN_KEY_ALIAS:?Missing RELEASE_KEY_ALIAS}"
          : "${SIGN_KEY_PASSWORD:?Missing RELEASE_KEY_PASSWORD}"
          umask 077
          export SIGN_KEY_FILE="$(mktemp "$RUNNER_TEMP/wanxiang-debug-signing-XXXXXX.jks")"
          trap 'rm -f "$SIGN_KEY_FILE"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$SIGN_KEY_FILE"
          unset RELEASE_KEYSTORE_BASE64
          test -s "$SIGN_KEY_FILE"
          ./gradlew --no-daemon :app:assembleDebug -PsignDebugWithRelease=true -PlocalRimeSdkDir="$RUNNER_TEMP/evo-sdk"
          expected=$(keytool -exportcert -keystore "$SIGN_KEY_FILE" -alias "$SIGN_KEY_ALIAS" -storepass:env SIGN_KEY_PWD | sha256sum | cut -d' ' -f1)
          apks=(app/build/outputs/apk/debug/*.apk)
          test "${#apks[@]}" -eq 1
          test -f "${apks[0]}"
          actual=$("$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs "${apks[0]}" | awk -F': ' '/^Signer #1 certificate SHA-256 digest: / {print $2}')
          test "$actual" = "$expected"
      - name: Build PR or other branch Debug APK without release secrets
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/dev'
        run: ./gradlew :app:assembleDebug -PlocalRimeSdkDir="$RUNNER_TEMP/evo-sdk"
      - name: Verify and stage Debug APK
        run: |
          mkdir -p dist
          apks=(app/build/outputs/apk/debug/*.apk)
          test "${#apks[@]}" -eq 1
          test -f "${apks[0]}"
          package=$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "${apks[0]}")
          test "$package" = com.amzxyz.wanxiang.ime.debug
          cp "${apks[0]}" dist/wanxiang-debug.apk
          python3 tools/verify-direct-rime-apk.py dist/wanxiang-debug.apk
          python3 -c 'import json, subprocess, zipfile; m = json.loads(zipfile.ZipFile("dist/wanxiang-debug.apk").read("assets/bundled/rime-sdk-manifest.json")); assert m["engine_family"] == "evo"; assert m["librime_commit"] == subprocess.check_output(["git", "-C", ".ci/evo", "rev-parse", "HEAD"], text=True).strip()'
          python3 tools/audit-direct-rime-link.py dist/wanxiang-debug.apk > dist/native-link-audit.json
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/dev' && 'Wanxiang-IME-arm64-debug' || 'Wanxiang-IME-arm64-debug-ci-test-key' }}
          path: dist/
          if-no-files-found: error
      - run: ./gradlew :app:testDebugUnitTest -PlocalRimeSdkDir="$RUNNER_TEMP/evo-sdk"
      - run: python3 tools/check-junit-results.py
      - run: ./gradlew -PdirectRimePrototype=true -PbuildABI="$BUILD_ABI" :direct-rime:assembleDebugAndroidTest -PlocalRimeSdkDir="$RUNNER_TEMP/evo-sdk"
